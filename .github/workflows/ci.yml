# Lint, type-check, test and build. No secrets: tests replay Qloo fixtures; `live` tests are excluded by pytest addopts.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      # One command, as a developer runs it: web#test waits for web#build (turbo.json), and vitest 4.0.18
      # waits up to 90 s for its worker, so `next build` no longer starves the tests.
      - run: pnpm turbo run lint check-types test build
