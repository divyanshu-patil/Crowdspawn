<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">The spawn score, worked for Mumbai in the Delhi Gullies sample</title>
  <desc id="desc">Taste lift 1.05 times platform fit 0.97 times culture fit 2.45 equals a spawn score of 2.49. Taste lift compares fans of your comparable games with all gamers in the city; platform fit is how strong your platforms are there; culture fit is how much people there love the films, shows and music of your game's setting.</desc>
  <defs>
    <pattern id="sketch" width="36" height="36" patternUnits="userSpaceOnUse" x="-1" y="-1">
      <path d="M36 0H0V36" fill="none" stroke="#d9d9d9" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="24" fill="#f5f5f5"/>
  <rect width="1200" height="360" rx="24" fill="url(#sketch)"/>

  <text x="48" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="1.5" fill="#5c5c5c">THE SPAWN SCORE · MUMBAI FOR DELHI GULLIES (SECOND SAMPLE)</text>

  <g id="terms" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#141414">
    <g transform="translate(48 90)">
      <rect x="6" y="6" width="236" height="190" rx="14" fill="#141414"/>
      <rect width="236" height="190" rx="14" fill="#ffffff" stroke="#141414" stroke-width="2.5"/>
      <text x="20" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="1">TASTE LIFT</text>
      <text x="18" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="56" font-weight="700">1.05</text>
      <text x="20" y="142" font-size="19">Fans of your comps</text>
      <text x="20" y="168" font-size="19">vs all gamers here</text>
    </g>
    <text x="312" y="196" text-anchor="middle" font-size="40" font-weight="700">×</text>
    <g transform="translate(340 90)">
      <rect x="6" y="6" width="236" height="190" rx="14" fill="#141414"/>
      <rect width="236" height="190" rx="14" fill="#ffffff" stroke="#141414" stroke-width="2.5"/>
      <text x="20" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="1">PLATFORM FIT</text>
      <text x="18" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="56" font-weight="700">0.97</text>
      <text x="20" y="142" font-size="19">How strong your</text>
      <text x="20" y="168" font-size="19">platforms are here</text>
    </g>
    <text x="604" y="196" text-anchor="middle" font-size="40" font-weight="700">×</text>
    <g transform="translate(632 90)">
      <rect x="6" y="6" width="236" height="190" rx="14" fill="#141414"/>
      <rect width="236" height="190" rx="14" fill="#ffffff" stroke="#141414" stroke-width="2.5"/>
      <text x="20" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="1">CULTURE FIT</text>
      <text x="18" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="56" font-weight="700">2.45</text>
      <text x="20" y="142" font-size="19">Love for the setting's</text>
      <text x="20" y="168" font-size="19">films, shows, music</text>
    </g>
    <text x="896" y="196" text-anchor="middle" font-size="40" font-weight="700">=</text>
    <g transform="translate(924 90)">
      <rect x="6" y="6" width="236" height="190" rx="14" fill="#141414"/>
      <rect width="236" height="190" rx="14" fill="#ff8400" stroke="#141414" stroke-width="2.5"/>
      <text x="20" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="1">SPAWN SCORE</text>
      <text x="18" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="56" font-weight="700">2.49</text>
      <text x="20" y="142" font-size="19">Ranks the city.</text>
      <text x="20" y="168" font-size="19">Above 1 over-indexes.</text>
    </g>
  </g>

  <text x="48" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="0.5" fill="#5c5c5c">ALL RATIOS OF QLOO AFFINITY RANKS · NO TUNED WEIGHTS · AN AFFINITY INDEX, NOT A SALES FORECAST</text>
</svg>
