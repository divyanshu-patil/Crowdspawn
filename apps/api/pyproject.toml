[project]
name = "crowdspawn-api"
version = "0.1.0"
description = "Crowdspawn API: Qloo-grounded launch plans for indie games"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "asyncpg-stubs>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crowdspawn_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits real third-party APIs; never in CI"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "ASYNC109"]  # formatter owns line length; timeout param is the documented LLMProvider API

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["crowdspawn_api"]
mypy_path = "src"

[tool.uv]
link-mode = "copy"  # the repo lives on an external volume; hardlinks fail there
